<!doctype html>
<html lang="{{lang}}" data-paths="{{pathsAttr}}"{{rootAttr}}>
<head>
<meta charset="utf-8">
<script>{{prepaint}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{head}}
<link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/{{css}}">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="{{homeHref}}" aria-label="{{a:name}}">
      <img class="logo-light" src="/assets/logo-light.svg" width="90" height="36" alt="1ms" loading="lazy">
      <img class="logo-dark" src="/assets/logo-dark.svg" width="90" height="36" alt="1ms" loading="lazy">
      <span class="pname" data-i="name"></span>
    </a>
    <div class="top-acts">
      <label class="sel"><span class="sr" data-i="lang_label"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2 2.8 4 2.8 6.5S10 12.5 8 14.5C6 12.5 5.2 10.5 5.2 8S6 3.5 8 1.5z"/></svg>
        <select id="lang">{{langOpts}}</select>
      </label>
      <button class="icon-btn" id="helpBtn" type="button" aria-haspopup="dialog" aria-controls="help"><span class="sr" data-i="faq_h"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.8.6-.8 1.1v.4M8 11.3v.1"/></svg>
      </button>
      <a class="icon-btn gh" href="https://github.com/yt1988/cloud-cost-planner" target="_blank" rel="noopener noreferrer" aria-label="{{a:a_gh}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg></a>
      <button class="icon-btn" id="theme" type="button" aria-label="{{a:th_system}}">
        <svg class="i-sys" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg>
        <svg class="i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>
        <svg class="i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>{{h1}}</h1>
      <p class="lede">{{lede}}</p>
    </section>

    <section class="card inputs" aria-labelledby="inH">
      <h2 class="sr" id="inH" data-i="in_scene"></h2>
      <div class="scenes" role="group" aria-label="{{a:in_scene}}">{{scenes}}</div>
      <div class="grid">
        <div class="field wide" id="sizeField">
          <span class="lab" data-i="in_size"></span>
          <div class="seg" role="group" aria-label="{{a:in_size}}">{{sizes}}</div>
          <div class="custom" id="custom" hidden>
            <label><span data-i="f_vcpu"></span><input id="vcpu" type="number" min="1" max="64" step="1" inputmode="numeric"></label>
            <label><span data-i="f_ram"></span><input id="ram" type="number" min="0.5" max="256" step="0.5" inputmode="decimal"></label>
            <label><span data-i="f_disk"></span><input id="disk" type="number" min="0" max="10000" step="5" inputmode="numeric"></label>
          </div>
        </div>
        <div class="field">
          <label class="lab" for="gbN" data-i="in_gb"></label>
          <div class="amt"><input id="gbN" type="number" min="0" step="any" inputmode="decimal"><div class="seg units" role="group" aria-label="{{a:a_unit}}"><button type="button" data-unit="gb" data-v="1" aria-pressed="true">{{uGB}}</button><button type="button" data-unit="gb" data-v="1024" aria-pressed="false">{{uTB}}</button></div></div>
        </div>
        <div class="field">
          <label class="lab" for="stR"><span data-i="in_static"></span> <b id="stV" class="val"></b></label>
          <input id="stR" class="range" type="range" min="0" max="100" step="5">
          <p class="hint" data-i="static_hint"></p>
        </div>
        <div class="field">
          <label class="lab" for="sgN" data-i="in_store"></label>
          <div class="amt"><input id="sgN" type="number" min="0" step="any" inputmode="decimal"><div class="seg units" role="group" aria-label="{{a:a_unit}}"><button type="button" data-unit="storeGB" data-v="1" aria-pressed="true">{{uGB}}</button><button type="button" data-unit="storeGB" data-v="1024" aria-pressed="false">{{uTB}}</button></div></div>
        </div>
        <div class="field">
          <span class="lab" data-i="in_aud"></span>
          <div class="seg" role="group" aria-label="{{a:in_aud}}">{{auds}}</div>
        </div>
      </div>
      <details class="adv" id="adv">
        <summary data-i="adv"></summary>
        <div class="grid">
          <label class="field"><span class="lab" data-i="f_count"></span><input id="count" type="number" min="1" max="100" step="1" inputmode="numeric"></label>
          <label class="field"><span class="lab" data-i="f_cur"></span><select id="cur" class="pick-sel"><option value="USD">USD</option><option value="EUR">EUR</option><option value="CNY">CNY</option></select></label>
          <label class="field"><span class="lab" data-i="f_obj"></span><input id="objKB" type="number" min="1" step="any" inputmode="decimal"></label>
          <label class="chk"><input id="shared" type="checkbox"><span data-i="f_shared"></span></label>
          <label class="chk"><input id="free" type="checkbox"><span data-i="f_free"></span></label>
        </div>
      </details>
    </section>

    <section class="card result" aria-labelledby="outH">
      <h2 id="outH" data-i="out_h"></h2>
      <div class="verdict-row" id="verdictRow">
        <p class="verdict" id="verdict">{{verdict}}</p>
        <button class="btn primary" id="share" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10V2M5 4.5 8 1.5l3 3M3 8v5.5h10V8"/></svg><span data-i="share"></span></button>
      </div>
      <div class="picks" id="picks">{{picks}}</div>
      <p class="links"><a class="ext" data-tool="v2c" data-pend target="_blank" rel="noopener"><span data-i="l_v2c"></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M12 10v3.5H2.5V4H6"/></svg></a></p>
    </section>

    <section class="card chart" aria-labelledby="curveH">
      <h2 id="curveH" data-i="curve_h"></h2>
      <div id="curve">{{curve}}</div>
    </section>

    <section class="card more" aria-labelledby="tblH">
      <h2 id="tblH"><span data-i="tbl_h"></span> <small data-i="tbl_hint"></small></h2>
      <div class="tbl-wrap" id="tbl">{{table}}</div>
    </section>
{{facts}}
  </main>
  <a class="sumbar" id="sumbar" href="#outH" hidden><span class="sb-n"><b data-i="tag_cheapest"></b><span id="sbName"></span></span><span class="sb-p" id="sbPrice"></span></a>

  <footer class="foot">
    <nav class="sitemap" aria-label="{{a:sm_h}}">{{sitemap}}</nav>
    <div class="foot-l"><span>{{foot}}</span></div>
  </footer>
</div>

<div class="scrim" id="help" hidden>
  <div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="helpT">
    <div class="dlg-h"><h2 id="helpT" data-i="faq_h"></h2>
      <button class="icon-btn" data-close type="button" aria-label="{{a:a_close}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="help-b">
      <nav class="help-nav" id="helpNav" role="tablist">{{helpNav}}</nav>
      <div class="help-pick">
        <button class="icon-btn" type="button" data-hstep="-1" aria-label="{{a:a_prev}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg></button>
        <select id="helpSel" aria-labelledby="helpT"></select>
        <button class="icon-btn" type="button" data-hstep="1" aria-label="{{a:a_next}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg></button>
      </div>
      <div class="help-c" id="helpC">{{helpC}}</div>
    </div>
  </div>
</div>
<script type="application/json" id="data">{{data}}</script>
<script src="/assets/{{strings}}" defer></script>
<script src="/assets/{{js}}" defer></script>
</body>
</html>
