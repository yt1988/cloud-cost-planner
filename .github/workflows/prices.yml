# Every Monday: compare data/*.json with the providers' price APIs (AWS, Azure, Vultr) and flag entries not
# re-checked by hand for 90 days. A failed run means a price changed or is due for a check (see the job's log);
# GitHub emails the repository owner. Nothing is changed automatically.
name: prices
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/prices.mjs
